/* ระบบ 5 จัดทำคำสั่งราชการ — รูปแบบหน้าเว็บ (ตัวหน้าคำสั่ง A4 อยู่ที่ order.css) · ค่าสีเดียวกับระบบ 2–4 */
:root{--hh:65px;--bg:#f4f6f5;--card:#fff;--ink:#1d2a30;--mute:#5d6b70;--line:#dbe2df;--acc:#1f6f78;--accs:#e3f1f2;--ok:#2e7d4f;--oks:#e5f3ea;--bad:#b3452c;--bads:#fbe8e2;--warn:#a86400;--warns:#fff1d6;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DDNSarabun',Tahoma,sans-serif;font-size:20px;line-height:1.45}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
input,select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{width:44px;height:44px}.top h1{font-size:24px;margin:0;line-height:1.2}.top .sub{font-size:16px;color:var(--mute)}.top .grow{flex:1}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.card h2{font-size:22px;margin:0}.muted{color:var(--mute);font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.spin{width:22px;height:22px;border:3px solid var(--accs);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
.hint{border-radius:10px;padding:10px 14px;background:var(--accs);font-size:18px}.hint.warn{background:var(--warns)}.hint.bad{background:var(--bads);color:var(--bad)}
.hint ul{margin:6px 0 0;padding-left:22px}.hint summary{cursor:pointer;font-weight:700}
.login{max-width:520px;margin:30px auto 0;width:100%}.login input[type=password],.login input[type=url]{flex:1;min-width:0}
.err{color:var(--bad);font-size:17px;min-height:1.4em}
details.api summary{cursor:pointer;color:var(--mute);font-size:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 14px}
.fgrid label{display:grid;gap:2px;font-size:16px;color:var(--mute)}.fgrid input,.fgrid select{width:100%;color:var(--ink)}
.fgrid .wide{grid-column:1/-1}
.info{font-size:17px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:18px;max-width:min(92vw,720px);display:none;z-index:50}
#toast.bad{background:var(--bad)}
#prev{background:#dfe4e2;padding:0 0 30px;overflow-x:hidden}
#pgs{margin:0 auto;padding-top:14px}#pgs .o5pg{scroll-margin-top:56px}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.pbar{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:8px 14px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.pbar button{min-width:40px;padding:4px 10px}#pno{min-width:5.5em;text-align:center;font-weight:700;white-space:nowrap}#zv{display:inline-block;min-width:2.9em}
.fl{display:grid;gap:2px;font-size:16px;color:var(--mute)}
textarea{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);min-width:0;width:100%;resize:vertical;line-height:1.35}
.side fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:grid;gap:10px;min-width:0}
.side legend{font-weight:700;padding:0 6px;color:var(--ink)}
.side .fgrid{grid-template-columns:1fr 1fr}.side .fgrid .wide{grid-column:1/-1}
#tabs{display:none}
#acts{padding:10px 16px;background:var(--card);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}#acts .info{flex-basis:100%}
@media (min-width:900px){
  #ws.two{display:grid;grid-template-columns:clamp(340px,32vw,460px) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:calc(100vh - var(--hh));height:calc(100dvh - var(--hh))}
  #ws.two #view{grid-area:1/1;max-width:none;margin:0;padding:0;display:block;overflow:auto;background:var(--card);border-right:1px solid var(--line)}
  #ws.two .card.side{border:0;border-radius:0}
  #ws.two #acts{grid-area:2/1;border-right:1px solid var(--line)}
  #ws.two #prev{grid-area:1/2/3/3;overflow:auto}
}
@media (max-width:899px){
  #ws.two #tabs{display:flex;position:sticky;top:var(--hh);z-index:4;background:var(--card);border-bottom:1px solid var(--line)}
  #tabs button{flex:1;border:0;border-radius:0;padding:10px;font-weight:700;background:var(--card)}#tabs button.on{background:var(--accs);color:var(--acc)}
  #ws.two #view{padding:0 0 110px}#ws.two .card.side{border:0;border-radius:0}
  #ws.two.pv #view{display:none}
  #ws.two:not(.pv) #prev{position:absolute;left:-10000px;top:0;width:900px;height:0;overflow:hidden;visibility:hidden}   /* ไม่ใช้ display:none เพราะต้องวัดความสูงตอนแบ่งหน้า */
  #ws.two #acts{position:fixed;left:0;right:0;bottom:0;z-index:6}
  #ws.two #prev{padding-bottom:110px;overflow:visible;overflow-x:clip}   /* ไม่ให้ #prev เป็นกล่องเลื่อน ไม่งั้นแถบเครื่องมือไม่ติดขอบบนของจอ */.pbar{top:calc(var(--hh) + 45px);gap:6px;padding:8px 10px}.pbar button{min-width:36px;padding:4px 8px}
}
@media (max-width:760px){body{font-size:18px}.top h1{font-size:20px}main{padding:10px}}
@media print{
  html,body{background:#fff!important}
  .noprint,.top,main,#toast,#acts,#tabs,.pbar{display:none!important}
  #ws{display:block!important;height:auto!important}
  #prev{display:block!important;position:static!important;visibility:visible!important;left:auto!important;width:auto!important;height:auto!important;padding:0!important;background:#fff!important;overflow:visible!important}
  #pgs{zoom:1!important;padding:0!important}
}

  });

  var ac = window.AbortController ? new AbortController() : null, t = ac && setTimeout(function () { ac.abort(); }, ms || 60000);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), signal: ac ? ac.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(t); return j; }, function () { clearTimeout(t); throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); });
}

      '<label class="fl">เรื่อง<textarea id="t-subject" rows="2"></textarea></label>' +
      '<label class="fl">ย่อหน้านำ (ก่อนรายชื่อ)<textarea id="t-intro" rows="7"></textarea></label>' +
      '<label class="fl">ข้อความปิด (หลังรายชื่อ)<textarea id="t-close" rows="4"></textarea></label>' +
      '<div class="fgrid"><label class="wide">ผู้ลงนาม<input id="t-signer" type="text" autocomplete="off"></label>' +
      '<label class="wide">ตำแหน่งผู้ลงนาม<input id="t-signerpos" type="text" autocomplete="off"></label>' +
      '<label class="wide">ฝ่าย/หน่วยงาน<input id="t-dept" type="text" autocomplete="off"></label></div>' +
      '<div class="row"><button type="button" id="breset" title="ล้างข้อความที่แก้ของฉบับนี้ กลับไปใช้ตามชีต">↩ คืนค่าจากชีต</button><span class="info" id="ovn"></span></div></fieldset></section>');
    UI = true;
    $('f-no').value = F.no || ''; $('f-date').value = F.date || ''; $('f-from').value = F.from || ''; $('f-dg').value = dg === 'ar' ? 'ar' : 'th';
    ['f-ord', 'f-no', 'f-date', 'f-from', 'f-dg'].forEach(function (id) { $(id).addEventListener(id === 'f-ord' || id === 'f-dg' || id === 'f-date' ? 'change' : 'input', function () { saveForm(); if (id === 'f-ord') { fillText(); warns(); } draw(); }); });
    TXT.forEach(function (p) { $(p[1]).addEventListener('input', function () { ovSet(p[0], this.value); draw(); }); });
    $('breset').onclick = function () { var o = cur(); if (o) { delete OV[o.id]; SS.set('ov', OV); } fillText(); draw(); toast('คืนค่าตามชีตแล้ว'); };
    $('bref').onclick = function () { load(true); };
  }
  var sel = $('f-ord'), keep = sel.value || F.ord || '';
  sel.innerHTML = os.length ? os.map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.name) + '</option>'; }).join('') : '<option value="">(ยังไม่มีคำสั่งในแท็บ แม่แบบคำสั่ง)</option>';
  if (keep && os.some(function (o) { return String(o.id) === keep; })) sel.value = keep;
  var d = new Date(LOADED); $('age').textContent = 'โหลดข้อมูลเมื่อ ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' น.';
  if ($('bref')) $('bref').disabled = false;
  fillText(); saveForm(); warns(); draw();
}
function warns() {
  var o = cur(), w = ((DATA && DATA.warn) || []).concat(o ? o.warn || [] : []);
  $('warn').innerHTML = w.length ? '<div class="hint warn"><details open><summary>⚠ ข้อสังเกตจากชีต ' + w.length + ' ข้อ (ไม่พิมพ์ลงคำสั่ง)</summary><ul>' + w.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details></div>' : '';
}

/* ---------- สร้างหน้าคำสั่ง ---------- */
var ZM = 'fit', ZNOW = 1;
function setZoom() {
  var w = $('prev').clientWidth; if (!w) return;
  var pw = 210 * 96 / 25.4, fit = Math.min(1, Math.max(0.3, (w - 24) / pw)), z = ZM === 'fit' ? fit : ZM;
  ZNOW = z; $('pgs').style.zoom = Math.abs(z - 1) < 0.005 ? '' : z.toFixed(3); $('zv').textContent = Math.round(z * 100) + '%'; pageNow();
}
function zoomBy(d) { ZM = Math.max(0.3, Math.min(2, Math.round((ZNOW + d) * 10) / 10)); setZoom(); }
function pages() { return $('pgs').querySelectorAll('.o5pg'); }
function pageNow() {
  var pg = pages(), n = 0, i, bar = document.querySelector('.pbar').getBoundingClientRect().bottom;
  if (!pg.length) { $('pno').textContent = 'หน้า –'; return 0; }
  for (i = 0; i < pg.length; i++) if (pg[i].getBoundingClientRect().top <= bar + 40) n = i + 1;
  n = Math.max(1, n); $('pno').textContent = 'หน้า ' + n + ' / ' + pg.length; return n;
}
function pageGo(d) { var pg = pages(); if (!pg.length) return; var n = Math.max(1, Math.min(pg.length, pageNow() + d)); pg[n - 1].scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function drawNow() {
  clearTimeout(TM); TM = 0;
  var o = effOrder(), host = $('pgs'); R = null;
  if (!DATA || !o) { host.innerHTML = '<div class="empty">ยังไม่มีคำสั่งให้แสดง</div>'; $('info').textContent = DATA ? 'ยังไม่มีคำสั่งให้สร้าง' : ''; $('bprint').disabled = $('bword').disabled = true; pageNow(); return; }
  setZoom();
  try { R = O5ORDER.render(host, DATA, o, opts()); }
  catch (e) { host.innerHTML = '<div class="empty">สร้างคำสั่งไม่ได้</div>'; $('info').textContent = ''; toast('สร้างคำสั่งไม่ได้: ' + e.message, true); $('bprint').disabled = $('bword').disabled = true; return; }
  var n = 0; o.committees.forEach(function (c) { n += c.members.length; });
  $('info').textContent = R.pages.length + ' หน้า · ' + o.committees.length + ' คณะ · ' + n + ' รายชื่อ';
  $('bprint').disabled = $('bword').disabled = false; pageNow();
}
function draw() { clearTimeout(TM); TM = setTimeout(function () { TM = 0; FONTS.then(drawNow); }, 200); }
function flush() { if (TM) drawNow(); return !!R; }
function fileName() {
  var o = cur(), p = opts(), dt = /^(\d{4})/.exec(p.date), yr = dt ? (+dt[1] < 2400 ? +dt[1] + 543 : +dt[1]) : new Date().getFullYear() + 543;
  return (o ? o.name : 'คำสั่ง') + (p.no ? ' (ที่ ' + p.no + '-' + yr + ')' : '');
}
function doPrint() {
  if (!flush()) return;
  var t = document.title; document.title = fileName();
  var back = function () { document.title = t; window.removeEventListener('afterprint', back); };
  window.addEventListener('afterprint', back);
  try { window.print(); } catch (e) { back(); toast('พิมพ์ไม่ได้: ' + e.message, true); }
}
function doWord() {
  if (!flush()) return;
  try { DDNDOCX.save(O5DOCX.build(R.items, R.cols, R.mw, opts()), fileName()); }
  catch (e) { toast('สร้างไฟล์ Word ไม่ได้: ' + e.message, true); }
}

/* ---------- เริ่มต้น ---------- */
$('logo').src = LOGO;
$('bout').onclick = logout;
window.addEventListener('resize', function () { setZoom(); });
$('bprint').onclick = doPrint; $('bword').onclick = doWord;
$('pup').onclick = function () { pageGo(-1); }; $('pdn').onclick = function () { pageGo(1); };
$('zin').onclick = function () { zoomBy(0.1); }; $('zout').onclick = function () { zoomBy(-0.1); }; $('zfit').onclick = function () { ZM = 'fit'; setZoom(); };
$('prev').addEventListener('scroll', pageNow, { passive: true }); window.addEventListener('scroll', pageNow, { passive: true });
function tab(pv) { $('ws').classList.toggle('pv', pv); $('tset').classList.toggle('on', !pv); $('tprv').classList.toggle('on', pv); setZoom(); window.scrollTo(0, 0); }
$('tset').onclick = function () { tab(false); }; $('tprv').onclick = function () { tab(true); };
if (!GAS && !API) showLogin('');
else if (TOKEN || GAS) load(false, !TOKEN);
else showLogin('');
</script>
